name: Deploy

# Tests every push and pull request. Pushes to main deploy to Cloudflare Pages
# (project "commoner", custom domain commoner.letsimpl.fyi).
# Repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - run: node tools/sync-brand.mjs --check
        continue-on-error: true # warns when the live brand moved ahead of brand/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://commoner.letsimpl.fyi
    steps:
      - uses: actions/checkout@v4
      # Only runtime files are published; tests, tools and docs stay private.
      - name: Stage site
        run: |
          mkdir -p dist
          cp -R index.html styles.css manifest.json _headers robots.txt sitemap.xml LICENSE js vendor brand icons dist/
          # Every file the page loads must be present.
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const missing = [...html.matchAll(/(?:href|src)=\"\.\/([^\"]+)\"/g)].map(m => m[1]).filter(f => !fs.existsSync('dist/' + f));
            if (missing.length) { console.error('Missing from dist:', missing); process.exit(1); }
          "
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=commoner --branch=main --commit-dirty=true
